<!doctype html>
<html>
<head><meta charset="utf-8"><title>Toggle</title></head>
<body>
<div class="sg sg-screen">
  <ul class="sg-list">
    <li><label class="sg-toggle"><input class="sg-toggle__input" type="checkbox" checked><span class="sg-toggle__box" aria-hidden="true"></span><span class="sg-toggle__main"><span class="sg-toggle__title">Notify when something waits on me</span><span class="sg-toggle__meta">Gate 1, Gate 2 and agent questions</span></span><span class="sg-toggle__state" aria-hidden="true"></span></label></li>
    <li><label class="sg-toggle"><input class="sg-toggle__input" type="checkbox"><span class="sg-toggle__box" aria-hidden="true"></span><span class="sg-toggle__main"><span class="sg-toggle__title">Pause the pipeline</span></span><span class="sg-toggle__state" aria-hidden="true"></span></label></li>
    <li><label class="sg-toggle"><input class="sg-toggle__input" type="checkbox" disabled><span class="sg-toggle__box" aria-hidden="true"></span><span class="sg-toggle__main"><span class="sg-toggle__title">Sync on mobile data</span><span class="sg-toggle__meta">Turn on background sync first</span></span><span class="sg-toggle__state" aria-hidden="true"></span></label></li>
  </ul>
</div>
</body>
</html>
