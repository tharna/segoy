<!-- @dsCard group="Actions" height=170 subtitle="Bracketed labels, 44px touch height" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Button</title></head>
<body>
<div class="sg sg-screen sg-stack">
  <div class="sg-inline">
    <button class="sg-btn sg-btn--primary" type="button">Send <kbd>⏎</kbd></button>
    <button class="sg-btn" type="button">Retry</button>
    <button class="sg-btn sg-btn--danger" type="button">Stop</button>
    <button class="sg-btn sg-btn--ghost" type="button">Cancel</button>
  </div>
  <div class="sg-inline">
    <button class="sg-btn sg-btn--primary" type="button" disabled>Send</button>
    <button class="sg-btn" type="button" disabled>Retry</button>
  </div>
</div>
</body>
</html>
