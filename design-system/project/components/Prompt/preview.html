<!-- @dsCard group="Input" height=150 subtitle="The docked input bar" -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>Prompt</title></head>
<body>
<div class="sg sg-screen">
  <form class="sg-prompt" onsubmit="event.preventDefault()">
    <span class="sg-prompt__caret" aria-hidden="true">&gt;</span>
    <label for="sg-prompt-demo" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Message Claude</label>
    <textarea id="sg-prompt-demo" class="sg-prompt__input" rows="1" placeholder="Ask Claude to change something…">add a retry to the flaky login test</textarea>
    <button class="sg-btn sg-btn--primary" type="submit">Send</button>
  </form>
  <div class="sg-prompt__hint"><span><span class="mode">⏵⏵ accept edits on</span> · shift+tab to cycle</span><span>/ for commands · @ for files</span></div>
</div>
</body>
</html>
