name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          files=$(git ls-files 'scripts/segoy' 'scripts/lib/*.sh' 'kit/**/*.sh' 'tests/*.sh')
          if [ -n "$files" ]; then
            # shellcheck is preinstalled on ubuntu-latest runners
            echo "$files" | xargs shellcheck
          else
            echo "no shell files yet"
          fi

      - name: Skill frontmatter and sections
        run: scripts/lib/lint-skills.sh

      - name: Tests
        run: tests/run.sh

      - name: Design system contrast check
        run: python3 design-system/scripts/build.py --check
